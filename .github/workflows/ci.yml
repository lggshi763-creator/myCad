name: CI

on:
  push:
    branches: [master_init, main, develop]
  pull_request:
    branches: [master_init, main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Tier-A isolation check — domain layer must not reference OCCT / EnTT / Qt.
  # Pure grep, no build needed. Fails fast before the expensive matrix starts.
  # ADR-0002 (domain zero deps), ADR-0004 (OCCT infra-only), ADR-0007 (EnTT).
  # --------------------------------------------------------------------------
  domain-isolation:
    name: Domain layer isolation check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tier-A isolation check (domain must not reference OCCT/EnTT/Qt/fmt)
        run: |
          result=$(grep -rn \
            '#include[[:space:]]*[<"]\(occt\|TopoDS\|BRep_\|entt/\|Qt\|fmt/\|spdlog\|<format>\)' \
            src/domain/ 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "VIOLATION: domain layer contains forbidden includes:"
            echo "$result"
            exit 1
          fi
          echo "OK — domain layer is clean (ADR-0002 / ADR-0004 / ADR-0007)"

      - name: Tier-B isolation check (infrastructure headers must not leak OCCT or OpenGL)
        run: |
          result=$(grep -rn \
            '#include[[:space:]]*[<"]\(TopoDS\|BRep_\|BRepPrim\|BRepMesh\|Poly_\|Bnd_\|gp_\|opencascade/\)' \
            src/infrastructure/geometry/include/ \
            src/infrastructure/eventsourcing/include/ \
            src/infrastructure/ecs/include/ 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "VIOLATION: infrastructure public headers contain OCCT leakage:"
            echo "$result"
            exit 1
          fi
          echo "OK — infrastructure/geometry+eventsourcing+ecs public headers are OCCT-free (ADR-0004 V6)"

          result=$(grep -rn \
            '#include[[:space:]]*[<"]\(GL/\|GLES\|QOpenGLFunctions\|QOpenGLContext\|QOpenGLWidget\)' \
            src/infrastructure/rendering/include/ 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "VIOLATION: rendering public headers contain OpenGL/Qt-GL leakage:"
            echo "$result"
            exit 1
          fi
          echo "OK — infrastructure/rendering public headers are OpenGL-free (ADR-0005)"

  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    # First cold build needs ~2-3h on Windows (OCCT + Qt6, each port built
    # for both Debug and Release variants). Subsequent runs hit
    # actions/cache and complete in minutes. 240 = 4h leaves headroom for
    # the cold build; bump only if first-run still times out.
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-13]
        build_type: [Debug, RelWithDebInfo]
        include:
          - os: windows-2022
            preset_prefix: vs2022-x64
            triplet: x64-windows
          - os: ubuntu-24.04
            preset_prefix: linux-gcc
            triplet: x64-linux
          - os: macos-13
            preset_prefix: macos-clang
            # macos-13 GitHub runner is Intel x64; preset default arm64-osx is overridden below.
            triplet: x64-osx

    env:
      # vcpkg writes binary archives here; actions/cache wraps this dir.
      # Note: vcpkg's x-gha provider was REMOVED upstream (2024+) — we use
      # actions/cache + baseline pin instead. The "cache never matches"
      # problem before was caused by ABI hash drift (runner vcpkg HEAD
      # following origin/master), now fixed by pinning runner vcpkg to
      # vcpkg.json's builtin-baseline.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
      # Linux GitHub runners: 4 cores, 7 GB RAM. qtbase link can spike
      # to 4-5 GB per linker; cap concurrency to avoid OOM.
      VCPKG_MAX_CONCURRENCY: 2

    steps:
      # ----------------------------------------------------------------------
      # Free disk space on Linux runner.
      #
      # GitHub-hosted Linux runners come with ~14 GB free on /, but Qt6 +
      # OCCT debug build via vcpkg consumes 20+ GB across:
      #   - /usr/local/share/vcpkg/buildtrees/qtbase  (~10 GB Qt6 alone)
      #   - /usr/local/share/vcpkg/installed/         (libs + headers)
      #   - $VCPKG_DEFAULT_BINARY_CACHE               (compressed archives)
      # The libQt6Widgets.a archive step had been failing with
      #     /usr/bin/ar: lib/libQt6Widgets.a: No space left on device
      # because runners' default free space is exhausted. This action frees
      # ~25-30 GB by removing preinstalled .NET / Android / Haskell / etc.
      # we don't use. Saves ~30 min of debugging when the next big port lands.
      # ----------------------------------------------------------------------
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false        # keep cached gcc / cmake / etc.
          android: true
          dotnet: true
          haskell: true
          large-packages: false    # skip; flaky and we don't need to nuke apt cache
          docker-images: true
          swap-storage: false      # keep swap; helps mitigate OOM during link

      - name: Show disk space (Linux)
        if: runner.os == 'Linux'
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Map build_type → preset suffix (Debug→debug, RelWithDebInfo→release)
      # ----------------------------------------------------------------------
      - name: Resolve preset name
        id: preset
        shell: bash
        run: |
          case "${{ matrix.build_type }}" in
            Debug)          suffix=debug ;;
            RelWithDebInfo) suffix=release ;;
            *) echo "::error::Unknown build_type ${{ matrix.build_type }}"; exit 1 ;;
          esac
          echo "name=${{ matrix.preset_prefix }}-${suffix}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # vcpkg: use the preinstalled copy on each runner
      # ----------------------------------------------------------------------
      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -Append $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT" | Out-File -Append $env:GITHUB_PATH

      - name: Set VCPKG_ROOT (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_PATH"

      # ----------------------------------------------------------------------
      # Pin runner's preinstalled vcpkg to EXACTLY the commit specified by
      # vcpkg.json's builtin-baseline. This keeps vcpkg's ABI hashes (used
      # as binary cache keys) stable across CI runs. If we `git reset --hard
      # origin/master` instead, upstream master moves daily and every CI
      # run sees a different vcpkg state → different ABI hashes → binary
      # cache never hits → 2-3h cold build every push.
      # ----------------------------------------------------------------------
      - name: Read baseline from vcpkg.json
        id: vcpkg_baseline
        shell: bash
        run: |
          BASELINE=$(jq -r '.["builtin-baseline"]' vcpkg.json)
          if [ -z "$BASELINE" ] || [ "$BASELINE" = "null" ]; then
              echo "::error::vcpkg.json missing builtin-baseline"
              exit 1
          fi
          echo "sha=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "Pinning runner vcpkg to baseline: $BASELINE"

      - name: Pin vcpkg to baseline (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$VCPKG_ROOT"
          sudo git fetch --unshallow 2>/dev/null || sudo git fetch origin
          sudo git reset --hard "${{ steps.vcpkg_baseline.outputs.sha }}"
          git log -1 --format='%H %s'

      - name: Pin vcpkg to baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd $env:VCPKG_ROOT
          git fetch --unshallow 2>$null
          if ($LASTEXITCODE -ne 0) { git fetch origin }
          git reset --hard "${{ steps.vcpkg_baseline.outputs.sha }}"
          git log -1 --format='%H %s'

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      # Restore + save vcpkg binary archives across runs.
      # Key includes vcpkg.json hash so manifest changes invalidate cache.
      # Restore-keys provide partial-match fallback if exact key missing.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ matrix.build_type }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ matrix.build_type }}-
            vcpkg-${{ matrix.triplet }}-

      # ----------------------------------------------------------------------
      # System deps (Qt / OCCT need lots of dev libs on Linux + macOS).
      # Ninja is required by the linux-gcc-* / macos-clang-* presets'
      # generator (CMakePresets.json sets `"generator": "Ninja"` for those).
      # We install via the OS package manager rather than a third-party
      # action — it's bulletproof and PATH is auto-set.
      # ----------------------------------------------------------------------
      - name: Install Linux Qt/OCCT system deps + Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            autoconf-archive bison flex \
            libxi-dev libxmu-dev libxkbcommon-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libdbus-1-dev libfontconfig1-dev
          ninja --version  # fail fast if not on PATH

      - name: Install macOS Qt/OCCT system deps + Ninja
        if: runner.os == 'macOS'
        run: |
          brew install ninja autoconf-archive bison
          ninja --version  # fail fast if not on PATH

      # Windows: ninja is preinstalled in the runner image but not always on
      # the default PATH. vcpkg's port builds invoke cmake -G Ninja internally
      # (regardless of our project's VS generator), so it must be findable.
      # `where ninja` will fail-fast if missing; choco install is the fallback.
      - name: Verify / install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
              ninja --version
              "ninja already on PATH" | Write-Host
          } else {
              "ninja missing from PATH; installing via choco..." | Write-Host
              choco install ninja -y --no-progress
              ninja --version
          }

      # ----------------------------------------------------------------------
      # Configure / Build / Test using CMake presets
      # ----------------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          # Defense-in-depth diagnostics so any future "X not found"
          # errors from cmake are traceable to a missing tool / bad PATH.
          echo "[diag] Runner OS = ${{ runner.os }}"
          echo "[diag] PATH = $PATH"
          which cmake || echo "[diag] cmake NOT on PATH"
          which ninja || echo "[diag] ninja NOT on PATH"
          ninja --version 2>/dev/null || echo "[diag] ninja --version failed"
          cmake --version | head -1
          echo "[diag] vcpkg HEAD:"
          (cd "$VCPKG_ROOT" && git log -1 --format='%H %s')

          if [ "${{ runner.os }}" = "macOS" ]; then
            # macos-13 runner is Intel; override the arm64-osx preset default
            cmake --preset ${{ steps.preset.outputs.name }} \
                  -DVCPKG_TARGET_TRIPLET=x64-osx
          else
            cmake --preset ${{ steps.preset.outputs.name }}
          fi

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ steps.preset.outputs.name }} --parallel

      - name: Test
        shell: bash
        run: ctest --preset ${{ steps.preset.outputs.name }} --output-on-failure

      # ----------------------------------------------------------------------
      # Upload test reports / logs on failure
      # ----------------------------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/${{ steps.preset.outputs.name }}/test-reports/
            build/${{ steps.preset.outputs.name }}/Testing/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload vcpkg buildtree logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7
